<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#0d1124"/><stop offset="100%" stop-color="#140d28"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#9b51e0"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".2"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".05"/></linearGradient><linearGradient id="pillGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#9b51e0" stop-opacity=".25"/><stop offset="100%" stop-color="#f72585" stop-opacity=".08"/></linearGradient><linearGradient id="orbGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".35"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></linearGradient><linearGradient id="orbGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f72585" stop-opacity=".3"/><stop offset="100%" stop-color="#7209b7" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes shimmerGrid{0%{opacity:.12}50%{opacity:.22}}@keyframes orbitFlow{0%{stroke-dashoffset:0}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400}.mono-text{font-family:&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace;font-size:13px;font-weight:600}.floating-bg-card-1,.floating-bg-card-2{animation:floatSlow 7s ease-in-out infinite;transform-origin:center}.floating-bg-card-2{animation:floatReverse 8s ease-in-out infinite}.pulsing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:15% 20%}.pulsing-orb-2{animation:pulseGlow 7s ease-in-out infinite 1s;transform-origin:85% 75%}.grid-lines{animation:shimmerGrid 4s ease-in-out infinite}.flow-path{stroke-dasharray:10 14;animation:orbitFlow 18s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="180" cy="110" r="240" fill="url(#orbGrad1)" class="pulsing-orb-1" filter="url(#glow)"/><circle cx="1020" cy="310" r="220" fill="url(#orbGrad2)" class="pulsing-orb-2" filter="url(#glow)"/><g fill="none" stroke="#4facfe" stroke-width=".75" class="grid-lines"><path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350"/><path d="M 120,0 L 120,420 M 240,0 L 240,420 M 360,0 L 360,420 M 480,0 L 480,420 M 600,0 L 600,420 M 720,0 L 720,420 M 840,0 L 840,420 M 960,0 L 960,420 M 1080,0 L 1080,420"/></g><path fill="none" stroke="#00f2fe" stroke-width="2" d="M -50,330 Q 300,180 600,320 T 1250,220" class="flow-path" opacity=".25"/><path fill="none" stroke="#f72585" stroke-width="1.8" d="M -50,110 Q 350,290 700,90 T 1250,240" class="flow-path" opacity=".2"/><g class="floating-bg-card-1" opacity=".75"><g transform="translate(60, 260)"><rect width="180" height="90" fill="#111827" stroke="#374151" stroke-width="1.2" rx="12"/><rect width="180" height="90" fill="url(#pillGrad1)" rx="12"/><circle cx="28" cy="28" r="8" fill="#00f2fe" opacity=".8"/><text x="44" y="32" fill="#e5e7eb" class="mono-text">PBR Maps</text><text x="24" y="60" fill="#9ca3af" font-family="sans-serif" font-size="11">Albedo • Normal • Height</text><text x="24" y="75" fill="#4facfe" font-family="sans-serif" font-size="10">Roughness • Metallic</text></g></g><g class="floating-bg-card-2" opacity=".75"><g transform="translate(960, 70)"><rect width="180" height="90" fill="#111827" stroke="#374151" stroke-width="1.2" rx="12"/><rect width="180" height="90" fill="url(#pillGrad2)" rx="12"/><circle cx="28" cy="28" r="8" fill="#f72585" opacity=".8"/><text x="44" y="32" fill="#e5e7eb" class="mono-text">AI Synthesis</text><text x="24" y="60" fill="#9ca3af" font-family="sans-serif" font-size="11">Text-to-PBR • Image2Tex</text><text x="24" y="75" fill="#f72585" font-family="sans-serif" font-size="10">Multi-View Consistent 4K</text></g></g><g id="foreground-titles"><g transform="translate(420, 48)"><rect width="360" height="32" fill="#1f2937" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="16"/><circle cx="22" cy="16" r="5" fill="#38bdf8"/><text x="36" y="21" fill="#e0f2fe" class="mono-text" font-size="11.5" letter-spacing="1">CURATED 3D GRAPHICS &amp; AI ECOSYSTEM</text></g><text x="600" y="145" fill="url(#accentGrad)" class="title-text" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.7))" font-size="44" text-anchor="middle">3D Texture Synthesis &amp; Material Generation</text><text x="600" y="195" fill="#f3f4f6" class="subtitle-text" font-size="19" font-weight="500" letter-spacing=".2" text-anchor="middle">Physically Based Rendering (PBR) • Procedural Shaders • 3D Mesh Painting • Generative AI</text><text x="600" y="226" fill="#9ca3af" class="subtitle-text" font-size="14.5" text-anchor="middle">The definitive directory of industry-standard SaaS platforms, open-source repositories &amp; neural texturing models</text><g><g transform="translate(190, 275) translate(0, 0)"><rect width="185" height="42" fill="#111827" stroke="#38bdf8" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#38bdf8"/><text x="38" y="26" fill="#f9fafb" class="mono-text">PBR Maps (4K/8K)</text></g><g transform="translate(190, 275) translate(205, 0)"><rect width="200" height="42" fill="#111827" stroke="#a855f7" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#a855f7"/><text x="38" y="26" fill="#f9fafb" class="mono-text">Procedural Nodes</text></g><g transform="translate(190, 275) translate(425, 0)"><rect width="190" height="42" fill="#111827" stroke="#ec4899" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#ec4899"/><text x="38" y="26" fill="#f9fafb" class="mono-text">3D Mesh Painting</text></g><g transform="translate(190, 275) translate(635, 0)"><rect width="185" height="42" fill="#111827" stroke="#10b981" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#10b981"/><text x="38" y="26" fill="#f9fafb" class="mono-text">Neural Synthesis</text></g></g><rect width="1198" height="418" x="1" y="1" fill="none" stroke="#374151" stroke-width="1.5" opacity=".6" rx="15"/></g></svg>